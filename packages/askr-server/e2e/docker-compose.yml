# The marketplace relay as deployed (elisym-infra/relay/prod), unchanged but for its URL (2.4),
# and the server's Postgres (9).
name: askr-e2e
services:
  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    platform: linux/amd64
    ports:
      - '7447:8080'
    volumes:
      - ./relay-config.toml:/usr/src/app/config.toml:ro
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: askr
      POSTGRES_PASSWORD: askr
      POSTGRES_DB: askr
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
