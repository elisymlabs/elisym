name: Askr server image

# The Askr server is private (never on npm), so the release workflow, which
# builds images of published packages only, does not build it (9). This one
# pushes ghcr.io/elisymlabs/askr-server for every green CI run on main,
# then asks elisym-infra to pin that image and deploy it (the deploy job
# below; elisym-infra's "Deploy Askr (prod)" does the rest).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One run at a time, none cancelled, so a push is never cut off half way. A
# run does not trust its turn in the queue (CI runs of two commits can finish
# in either order): it moves :latest only if its commit is still the head of
# main when it pushes, so an older commit's run never moves :latest back. The
# per-commit tag is always pushed. GitHub keeps one pending run per group, so
# a burst of merges may skip a middle commit's image; :latest still ends on
# the newest one.
#
# Accepted lag: when a green commit's run finds main already moved on and
# the newer commit then fails CI, :latest stays on an older image until the
# next green commit at main's head moves it (the green commit's own
# :<version>-<sha> tag is pushed all the same). Moving :latest by ancestry
# instead would need the current :latest's revision label and a history
# walk, for a tag nothing deploys from automatically: a deploy names the
# per-commit tag it wants.
concurrency:
  group: askr-server-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.tags.outputs.image }}
      head: ${{ steps.tags.outputs.head }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read the server version
        id: version
        run: echo "version=$(jq -r .version packages/askr-server/package.json)" >> "$GITHUB_OUTPUT"

      # The Dockerfile builds from source inside the image; nothing is built here.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Choose the tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image=ghcr.io/elisymlabs/askr-server
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "image=$image:$VERSION-$SHA" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$SHA" ]; then
            echo 'head=true' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'list<<EOF'
            echo "$image:$VERSION-$SHA"
            if [ "$head" = "$SHA" ]; then
              echo "$image:latest"
            else
              echo "main moved on to $head: :latest is left to its run" >&2
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/askr-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=askr-server
          cache-to: type=gha,mode=max,scope=askr-server

  # Only the image of main's head is deployed, by the same rule as :latest above, so an older
  # commit's run never rolls production back. elisym-infra pins the tag in its compose file,
  # commits it and deploys (its deploy-askr workflow, repository_dispatch askr-server-image).
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: image
    if: needs.image.outputs.head == 'true'

    permissions: {}

    steps:
      - name: Ask elisym-infra to deploy the image
        env:
          # A fine-grained token for elisymlabs/elisym-infra only, Contents: read and write
          # (what repository_dispatch needs).
          GH_TOKEN: ${{ secrets.ASKR_INFRA_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.image.outputs.image }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Checked again after the build: a merge during it leaves the deploy to its own run.
          head=$(git ls-remote https://github.com/elisymlabs/elisym.git refs/heads/main | cut -f1)
          if [ "$head" != "$SHA" ]; then
            echo "main moved on to $head: the deploy is left to its run"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ASKR_INFRA_DISPATCH_TOKEN is not set: $IMAGE is pushed but not deployed"
            exit 0
          fi
          jq -n --arg image "$IMAGE" '{event_type: "askr-server-image", client_payload: {image: $image}}' |
            gh api repos/elisymlabs/elisym-infra/dispatches --input -
          echo "deploy of $IMAGE requested"
