name: CI

on:
  push:
    branches: [main]
  pull_request:
    # commerce-p*: the stacked commerce PRs target each other; comcore: the Askr stack.
    branches: [main, evm, 'commerce-p*', comcore]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    name: QA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install dependencies
        run: bun install

      - name: Run QA
        run: bun run qa
        env:
          # Ten test suites at once (each with a worker per core) ran the runner out of
          # memory once the Askr packages and vitest 4 came in.
          TURBO_TEST_CONCURRENCY: '3'
